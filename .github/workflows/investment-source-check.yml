name: Investment registry source check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/investment-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install openpyxl==3.1.5
      - name: Test parser and check original source
        working-directory: site
        run: |
          python3 -m unittest -v test_investment_projects.py
          python3 - <<'PY'
          import investment_projects as p
          from datetime import date
          import hashlib
          from collections import Counter
          raw=p.fetch(p.SOURCE)
          url=p.discover(raw,date.today())
          print("DISCOVERED",url,flush=True)
          rows=p.parse_html(raw,url)
          print("HTML_PARSED",len(rows),hashlib.sha256(raw).hexdigest(),flush=True)
          try:
              raw=p.fetch(url)
              print("XLSX",len(raw),hashlib.sha256(raw).hexdigest(),flush=True)
              rows=p.parse(raw,url)
          except Exception as e:
              print("XLSX_UNAVAILABLE",type(e).__name__,str(e),flush=True)
          print("PARSED",len(rows),dict(Counter(r["status"] for r in rows)),flush=True)
          print("VALUES",sum(r["cost_mln_rub"] is not None for r in rows),sum(r["jobs"] is not None for r in rows))
          PY
      - name: Inspect Amur regional workbook schema (no import yet)
        working-directory: site
        run: |
          python3 - <<'PY'
          import investment_projects as p
          import io,hashlib,openpyxl,zipfile
          url="https://www.invest.amurobl.ru/upload/iblock/f3b/3p1q88k692k67ub94yaa643moq6cyd8w/Reestr-investitsionnyy-proektov-01.10.2026.xlsx"
          raw=p.fetch(url)
          print("AMUR_XLSX",len(raw),hashlib.sha256(raw).hexdigest(),flush=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              if sum(x.file_size for x in z.infolist())>50000000:raise ValueError("XLSX expansion")
          b=openpyxl.load_workbook(io.BytesIO(raw),read_only=True,data_only=True)
          try:
              for ws in b:
                  print("SHEET",ws.title,ws.max_row,ws.max_column,flush=True)
                  for i,row in enumerate(ws.iter_rows(min_row=1,max_row=8,max_col=min(ws.max_column or 30,30),values_only=True),1):
                      # Log only header and cell types, not individual project contact details.
                      if i<=4:print("HEADER",i,[str(x)[:160] if x is not None and not isinstance(x,(int,float)) else type(x).__name__ for x in row],flush=True)
                      else:print("TYPES",i,[type(x).__name__ for x in row],flush=True)
          finally:b.close()
          PY

      - name: Parse Amur workbook with validated schema
        working-directory: site
        run: |
          python3 -m unittest -v test_amur_projects.py
          python3 - <<'PY'
          import amur_projects as a
          from collections import Counter
          raw=a.fetch(a.BASELINE)
          import openpyxl,io
          b=openpyxl.load_workbook(io.BytesIO(raw),read_only=True,data_only=True)
          try:
              ws=b["Новая версия"]; previous=None;counts=Counter();numbered=0
              for i,v in enumerate(ws.iter_rows(max_col=13,values_only=True),1):
                  if i<6:continue
                  if not any(x is not None for x in v):continue
                  no=v[0];counts[str(v[5])]+=1
                  if not isinstance(no,int) or previous is not None and no!=previous+1:
                      print("AMUR_BOUNDARY",i,repr(no),repr(previous),"sector",str(v[4])[:100],"status",str(v[5])[:100],"name_type",type(v[1]).__name__,flush=True)
                  if isinstance(no,int):numbered+=1
                  previous=no if isinstance(no,int) else None
                  for k in (11,12):
                      try:a.numeric(v[k],k==12)
                      except ValueError:print("AMUR_MARKER",i,k,repr(v[k])[:100],flush=True)
              print("AMUR_NUMBERED",numbered,"STATUS",dict(counts),flush=True)
          finally:b.close()
          try:rows=a.parse(raw,a.BASELINE)
          except ValueError as e:
              print("AMUR_PARSE_REJECTED",str(e),flush=True)
              rows=[]
          print("AMUR_PARSED",len(rows),flush=True)
          print("AMUR_STATUS",dict(Counter(r["status"] for r in rows)),flush=True)
          print("AMUR_SECTORS",len({r["sector"] for r in rows}),flush=True)
          print("AMUR_MUNICIPALITIES",len({r["municipality"] for r in rows}),flush=True)
          print("AMUR_VALUES",dict(Counter(r["cost_state"] for r in rows)),dict(Counter(r["jobs_state"] for r in rows)),flush=True)
          PY

      - name: Inspect Buryatia original and Krasnodar workbook headers
        working-directory: site
        run: |
          python3 - <<'PY'
          import investment_projects as p
          import openpyxl,io,hashlib,zipfile
          for label,url in (("BURYATIA",p.BASELINE),("KRASNODAR","https://new.investkuban.ru/upload/iblock/c65/qzhzi1g82lrwkv29in0xpayrr0e8xm89.xlsx")):
              try:
                  raw=p.fetch(url);print(label,"XLSX",len(raw),hashlib.sha256(raw).hexdigest(),flush=True)
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      if sum(x.file_size for x in z.infolist())>50000000:raise ValueError("XLSX expansion")
                  b=openpyxl.load_workbook(io.BytesIO(raw),read_only=True,data_only=True)
                  try:
                      for ws in b:
                          print(label,"SHEET",ws.title,ws.max_row,ws.max_column,flush=True)
                          for i,row in enumerate(ws.iter_rows(min_row=1,max_row=8,max_col=min(ws.max_column or 30,30),values_only=True),1):
                              if i<=4:print(label,"HEADER",i,[str(x)[:200] if x is not None else "" for x in row],flush=True)
                              else:print(label,"TYPES",i,[type(x).__name__ for x in row],flush=True)
                  finally:b.close()
              except Exception as e:print(label,"UNAVAILABLE",type(e).__name__,str(e),flush=True)
          PY
