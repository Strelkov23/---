name: FNS full SME classification
on:
  push:
    branches: [main]
    paths: ['site/sme_full_import.py','site/test_sme_full_import.py','.github/workflows/sme-full-import.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sme-full-classification
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cd site
          python -m unittest test_sme_classification.py test_sme_full_import.py
          python sme_full_import.py --output ../sme-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sme-full-classification
          path: sme-full/
          if-no-files-found: ignore
          retention-days: 14
