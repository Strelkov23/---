name: Economic search prototype checks
on:
  push:
    branches: [economic-ai-prototype-v01]
    paths: ['site/economic-search*', 'site/test-economic-search.js', 'site/test_economic_search_browser.py', '.github/workflows/economic-search-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          node --check site/economic-search.js
          node site/test-economic-search.js
      - run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          python site/test_economic_search_browser.py
