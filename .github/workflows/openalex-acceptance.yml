name: Stage B OpenAlex network acceptance
on:
  push:
    branches: [stage-b-research-centre]
    paths: ['site/openalex_acceptance.py','.github/workflows/openalex-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage-b-openalex-acceptance
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated public metadata lookup
        working-directory: site
        run: python openalex_acceptance.py --catalog ../history/published/literature.json --output ../openalex-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openalex-acceptance
          path: openalex-acceptance.json
          retention-days: 30
          if-no-files-found: ignore
