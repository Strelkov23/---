name: Rosstat monetary cost live acceptance
on:
  push:
    branches: [stage-f-rosstat-cost-amounts]
    paths: ['site/rosstat_workbooks.py', '.github/workflows/rosstat-cost-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test observed annual workbook without production import
        run: |
          python -m pip install xlrd==2.0.2
          cd site
          python -m unittest test_rosstat_workbooks.py
          python - <<'PY'
          import json,collections
          import rosstat_workbooks as w
          from rosstat_network_probe import fetch
          from rosstat_cost_schema import URL
          payload=fetch(URL,"workbook")
          rows=w.parse(payload.raw,"cost",URL,2026)
          assert all(r["metric"] in w.AMOUNT_FIELDS for r in rows)
          assert set(r["year"] for r in rows)==set(range(2017,2026))
          quality=w.quality(dict(schema=1,files=[dict(url=URL,group="cost",success="2026-11-25",sha256=payload.sha256,rows=rows)]))
          print("COST_ACCEPTANCE",json.dumps(dict(sha256=payload.sha256,counts=dict(collections.Counter(r["year"] for r in rows)),quality=quality),ensure_ascii=False))
          PY
