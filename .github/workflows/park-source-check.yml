name: Park source inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/park-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public catalogue markup without collecting addresses
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          from html.parser import HTMLParser
          from collections import Counter
          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__();self.stack=[];self.classes=Counter();self.hits=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs);c=a.get('class','');self.classes[(tag,c)]+=1
                  if tag not in ('meta','link','input','img','br','hr','source','area','wbr'):self.stack.append((tag,c,a.get('id','')))
              def handle_endtag(self,tag):
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:self.stack=self.stack[:i];break
              def handle_data(self,s):
                  v=s.strip()
                  if v in ('Астраханская область','ОЭЗ Лотос','Фабрика','Гринфилд','Сертифицирован','Действующие','Создаваемые','Название:','Субъект РФ:','№55 АИП','Найдено 530 предложений') and len(self.hits)<35:self.hits.append((v,self.stack[-7:]))
          for url in ('https://indparks.ru/catalog/regions/','https://indparks.ru/catalog/','https://indparks.ru/certification/parks/'):
              try:
                  with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as f:raw=f.read(15000001)
                  if len(raw)>15000000:raise ValueError('oversized')
                  p=Inspect();p.feed(raw.decode('utf-8'))
                  print('PAGE',url,len(raw));print('CLASSES',p.classes.most_common(60));print('HITS',p.hits)
              except Exception as e:print('FAILED',url,type(e).__name__,str(e))
          PY
      - name: Parse full catalogue and verify source coverage
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=site python3 - <<'PY'
          import industrial_parks as p
          import hashlib,json
          from collections import Counter
          from urllib.request import urlopen,Request
          with urlopen(Request(p.SOURCE,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as f:raw=f.read(p.MAX+1)
          rows=p.parse(raw)
          data={**p.empty("2026-11-25"),"rows":rows,"status":"ok","checked":"2026-11-25","success":"2026-11-25","sha256":hashlib.sha256(raw).hexdigest()}
          print("PARKS",json.dumps(p.quality(data),ensure_ascii=False))
          print("TYPES",json.dumps(dict(Counter(r["type"] for r in rows)),ensure_ascii=False))
          print("REGIONS",json.dumps(dict(Counter(r["region"] for r in rows)),ensure_ascii=False))
          PY
      - name: Verify independent certificate list with exact number formats
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=site python3 - <<'PY'
          import industrial_parks as p, park_certificates as c
          from urllib.request import urlopen,Request
          import hashlib,json
          with urlopen(Request(c.SOURCE,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as f:raw=f.read(p.MAX+1)
          t=p.Tree();t.feed(raw.decode("utf-8-sig"))
          for row in t.root.find("certification-table__row"):
              print("CERT_CELLS",json.dumps([c.without_labels(n) for n in row.find("certification-table__td")],ensure_ascii=False))
          rows=c.parse(raw)
          d={**c.empty("2026-11-25"),"rows":rows,"status":"ok","checked":"2026-11-25","success":"2026-11-25","sha256":hashlib.sha256(raw).hexdigest()}
          print("CERTIFICATES",json.dumps(c.quality(d),ensure_ascii=False))
          PY
