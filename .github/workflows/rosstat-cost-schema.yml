name: Rosstat cost workbook schema diagnostic
on:
  push:
    branches: [stage-f-rosstat-cost-schema]
    paths: ['site/rosstat_cost_schema.py','.github/workflows/rosstat-cost-schema.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosstat-cost-schema
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect the confirmed public workbook
        run: |
          python -m pip install xlrd==2.0.2
          cd site
          python rosstat_cost_schema.py --output ../rosstat-cost-schema.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosstat-cost-schema
          path: rosstat-cost-schema.json
          retention-days: 30
          if-no-files-found: ignore
