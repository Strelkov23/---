name: Enterprise registration source check
on:
  push:
    branches: [main]
    paths: ['site/enterprise_sources.py', '.github/workflows/enterprise-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install openpyxl==3.1.5
      - name: Verify original workbooks
        working-directory: site
        run: |
          python3 -m unittest -v test_enterprise_sources.py
          python3 - <<'PY'
          import enterprise_sources as e
          from tempfile import TemporaryDirectory
          from pathlib import Path
          from datetime import date
          import json
          with TemporaryDirectory() as tmp:
              p=Path(tmp)
              d=e.publish(p,p,date.today().isoformat(),True)
              print(json.dumps(d,ensure_ascii=False,indent=2))
              ok=all(r["status"]=="ok" for r in d["rows"])
          import historical as h
          from collections import Counter
          try:
              url=h.mirror_url("enterprises")
              raw,_=h.get(url,35_000_000)
              rows=h.mirror_rows(raw,"enterprises",selected=False)
              titles=Counter((r["title"],r["unit"]) for r in rows)
              print("ENTERPRISE_ARCHIVE",url,"rows",len(rows),flush=True)
              for (title,unit),count in titles.most_common(80):
                  print("TITLE",title,unit,count,flush=True)
          except Exception as exc:print("ARCHIVE_UNAVAILABLE",str(exc),flush=True)
          import emiss_archive as ea
          for kind,code in e.EMISS.items():
              try:
                  raw,_=h.get(ea.primary(code),4_000_000)
                  print("EMISS_CARD",code,len(raw),flush=True)
              except Exception as exc:print("EMISS_CARD_UNAVAILABLE",code,str(exc),flush=True)
              for url in (ea.resource(code),"https://datalakeiepru-s3-storage-public.storage.yandexcloud.net/fedstatru/data/parquet/"+code+".parquet"):
                  try:
                      raw,_=h.get(url,24_000_000)
                      if raw[:2]!=bytes([31,139]) and raw[:4]!=b"PAR1":raise ValueError("Unexpected file signature")
                      print("EMISS_RESOURCE",code,url,len(raw),flush=True)
                  except Exception as exc:print("EMISS_RESOURCE_UNAVAILABLE",code,url,str(exc),flush=True)
          import hashlib
          url=h.mirror_url("enterprises")
          raw,_=h.get(url,35_000_000)
          rows=h.mirror_rows(raw,"enterprises",selected=True)
          print("SELECTED_ENTERPRISE",len(rows),"SHA256",hashlib.sha256(raw).hexdigest(),flush=True)
          for (title,unit),count in Counter((r["title"],r["unit"]) for r in rows).most_common():
              print("SELECTED",title,unit,count,flush=True)
          assert any(r["title"]=="Число организаций" for r in rows)
          assert any("фактически действующих индивидуальных предпринимателей" in r["title"] for r in rows)
          assert all(r["value"] not in h.MIRROR_MISSING_MARKERS for r in rows)
          assert len(rows)>10000
          if not ok:print("DIRECT_WORKBOOKS_UNAVAILABLE; HISTORICAL_ARCHIVE_VERIFIED",flush=True)
          PY
