name: Economic server vector prototype
on:
  push:
    branches: [economic-ai-prototype-v01]
    paths: ['site/economic-vector-*.js', 'site/test-economic-vector.js', '.github/workflows/economic-vector-prototype.yml']
  workflow_dispatch:
    inputs:
      shard:
        description: 'Research title shard 0–63'
        type: string
        default: '0'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check site/economic-vector-build.js
          node site/test-economic-vector.js
  encode:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned inference runtime
        run: npm install --prefix "$RUNNER_TEMP/vector-runtime" --no-audit --no-fund @xenova/transformers@2.17.2
      - name: Build a verified shard from the current public archive
        env:
          SHARD: ${{ inputs.shard || '0' }}
        run: |
          git fetch origin main --depth=1
          git archive FETCH_HEAD history/published/data-manifest.json history/published/economic-search-index.json | tar -x -C "$RUNNER_TEMP"
          node site/economic-vector-build.js "$RUNNER_TEMP/history/published" "$RUNNER_TEMP/vector-output" "$SHARD" "$RUNNER_TEMP/vector-runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: economic-research-title-vectors
          path: ${{ runner.temp }}/vector-output/
          if-no-files-found: error
          retention-days: 7
