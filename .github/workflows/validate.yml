name: Economic code checks
on:
  push:
    branches: [main, stage3-archive-acceptance, stage-a-data-contract, stage-b-research-centre, stage-c-diagnostics, stage-c-dependencies, stage-c-final-acceptance, stage-d-balance-audit, stage-d-feasibility, stage-d-physical-resources, stage-d-labor, stage-d-investment-horizon, stage-d-cost-decomposition, stage-d-territorial, stage-d-final-acceptance, stage-d-publish-acceptance, stage-e-plan-register, stage-e-public-plan-fact, stage-e-deviation-monitor, stage-e-plan-comparison, stage-e-diagnostic-link, stage-e-analyst-cockpit, stage-e-plan-report, stage-e-visual-system, stage-e-visual-analysis, stage-e-visual-charts, stage-e-visual-export-integrity, stage-e-final-acceptance, stage-e-deployment-verification, stage-e-mobile-visual-review, stage-f-rosstat-selection, stage-f-rosstat-cost-amounts, stage-f-rosstat-cost-reviewed, stage-f-cost-analytics, stage-f-regional-verified-series, stage-f-regional-regression-fix, stage-f-regional-cost-integration, stage-f-bank-cohort-queue, stage-f-bank-queue-audit, stage-f-sme-profile-index, stage-f-sme-profile-lookup, stage-f-sme-profile-publication, stage-f-sme-profile-archive, stage-f-sme-profile-autoupdate, stage-f-nao-project-schema, stage-f-nao-test-fix, stage-f-nao-column-audit, stage-f-nao-project-import, stage-f-nao-record-audit, stage-f-nao-section-identifiers, stage-f-nao-project-page, stage-f-nao-common-search, stage-f-project-export-reconciliation, stage-f-nao-real-acceptance, stage-f-nao-browser-regression, stage-f-bank-integration, stage-f-sme-release-integration, stage-f-sme-refreshed-integration, stage-f-nao-release-integration, stage-f-publish-copy-fix, stage-f-publish-real-preflight, stage-f-literature-coverage, stage-f-literature-resume, stage-f-literature-resume-fix, stage-f-literature-queue-passport, stage-f-literature-search-coverage, stage-f-literature-journal-expansion, stage-f-literature-release-integration, stage-f-literature-zero-coverage, stage-f-literature-exports, stage-f-literature-byte-acceptance, stage-f-bank-current-coverage, stage-f-bank-common-distribution, stage-f-bank-coverage-export, stage-f-bank-browser-acceptance, stage-f-final-candidate, stage-f-final-real-acceptance, stage-f-final-updated-archive, stage-g-comprehensive-acceptance, stage-g-resilience, stage-g-economic-review, stage-g-release-integration, stage-iv-workspace, economic-ai-v162-release-integration, economic-ai-v165-chat-onboarding, economic-ai-v168-research-quality, economic-ai-v171-research-recovery, economic-ai-v174-research-dialogue, economic-ai-v177-contextual-tools, economic-ai-v180-step-aware-research]
    paths: ['EconomicsPages.zip', 'site/**', '.github/workflows/validate.yml', '.github/workflows/publish.yml']
  workflow_dispatch:
concurrency:
  group: economic-code-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact revision for acceptance
        run: git rev-parse HEAD
      - name: Verify publication contract
        run: python3 site/test_publish_contract.py
      - name: Offline unit and calculation tests
        run: |
          unzip -q EconomicsPages.zip -d monitor
          # The artifact preflight imports Python modules and can create site/__pycache__.
          # Copy only top-level regular source files, never generated directories.
          find site -maxdepth 1 -type f -exec cp -t monitor/ -- {} +
          test -f monitor/build.py
          cd monitor
          python3 -m pip install openpyxl==3.1.5 pyarrow==20.0.0 xlrd==2.0.2 scipy==1.15.3
          python3 -m unittest test_regional_schema_probe.py test_rosstat_network_probe.py test_independent_trade.py test_independent_ember.py test_iv_release.py test_literature_resume.py test_literature_coverage.py test_nao_project_public.py test_nao_project_import.py test_nao_column_audit.py test_nao_project_schema.py test_sme_profile_public.py test_sme_profile_index.py test_bank_form_queue.py test_journal_evidence.py test_source_acceptance.py test_source_contract.py test_sme_classification.py test_sme_full_import.py test_sme_finance_join.py test_federal_budget.py test_rosstat_workbooks.py test_finance_workbooks.py test_link_recovery.py test_consistency.py test_stat_revisions.py test_freshness.py test_district_geo.py test_sme_regions.py test_facility_data.py test_electricity_balance.py test_food_balance.py test_cost_structure.py test_financial_state.py test_finance_data.py test_provenance.py test_wdi_metadata.py test_method_passports.py test_capital_data.py test_forecast.py test_labor_data.py test_balance_audit.py test_programme_evidence.py test_budget_diagnostics.py test_budget_programmes.py test_annual_goals.py test_goals.py test_programmes.py test_catalogue.py test_research.py test_quality.py test_national.py test_historical.py test_industrial.py test_sector_passports.py test_navigation.py test_regional_geo.py test_regional_manufacturing.py test_regional_industry_extra.py test_industrial_parks.py test_park_certificates.py test_investment_projects.py test_amur_projects.py test_krasnodar_projects.py test_project_coverage.py test_enterprise_sources.py test_amur_enterprises.py test_bank_registry.py test_bank_disclosure.py test_bank_report_probe.py test_bank_capital.py test_bank_capital_history.py test_bank_balance.py test_bank_profit.py test_company_sources.py test_company_import.py test_company_index.py test_company_names.py test_sme_finance_public.py test_sme_artifact.py test_group_passports.py test_corporate_watch.py test_corporate_discovery.py
          python3 -m compileall -q .
          for script in *.js; do node --check "$script"; done
          node test-global-economic-assistant.js
          node test-regional-disparities.js
          node test-regional-map.js
          node test-regional-dashboard.js
          node test-regional-manufacturing.js
          node test-territorial-plan.js
          node test-industrial-parks.js
          node test-park-certificates.js
          node test-news-map.js
          node test-site-search.js
          node test-interface.js
          node test-workspace.js
          node test-iv-lab.js
          node test-iv-policy.js
          node test-iv-lab-nav.js
          node test-iv-scenario-store.js
          node test-iv-evidence.js
          node test-iv-comparison.js
          node test-iv-physical.js
          node test-iv-physical-composite.js
          node test-iv-workspaces.js
          node test-iv-allocation.js
          node test-iv-trajectory.js
          node test-iv-tech.js
          node test-iv-methods.js
          node test-iv-origin.js
          node test-iv-energy-structure.js
          node test-iv-pulse.js
          node test-iv-trade.js
          node test-iv-labour.js
          node test-iv-prices.js
          node test-facility-map.js
          node test-bank-directory.js
          node test-company-lookup.js
          node test-sme-map.js
          node test-enterprise-diagnostics.js
          node test-district-map.js
          node test-freshness.js
          node test-stat-revisions.js
          node test-chain-stress.js
          node test-sector-chain.js
          node test-balance-matrix.js
          node test-capacity-analysis.js
          node test-chart-layout.js
          node test-macro-diagnostics.js
          node test-diagnostic-backtest.js
          node test-reproduction-plan.js
          node test-resource-plan.js
          node test-plan-feasibility.js
          node test-plan-register.js
          node test-public-plan-fact.js
          node test-deviation-monitor.js
          node test-plan-comparison.js
          node test-plan-diagnostics.js
          node test-analyst-cockpit.js
          node test-plan-report.js
          node test-horizon-feasibility.js
          node test-dynamic-plan.js
          node test-global-plan.js
          node test-labor-calibration.js
          node test-labor-diagnostics.js
          node test-investment-diagnostics.js
          node test-dependency-diagnostics.js
          node test-data-registry.js
          node test-research-projects.js
          node test-provenance.js
          node test-index-builder.js
          node test-composite-index.js
          node test-report-builder.js
          node test-cost-structure.js
          node test-food-balance.js
          node test-electricity-balance.js
          node test-energy-output.js
          node test-bank-capital.js
          node test-bank-capital-history.js
          node test-bank-balance.js
          node test-bank-profit.js
          node test-group-passports.js
          node test-sme-matrix.js
          node test-sme-finance.js
          node test-project-search.js
          python3 test_global_reference.py
      - name: Build from the saved archive without refreshing sources
        run: |
          mkdir -p monitor/data
          if test -f history/monitor.db.gz; then gzip -dc history/monitor.db.gz > monitor/data/monitor.db
          elif test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db
          else echo "Saved database missing"; exit 1; fi
          cd monitor
          ECONOMIC_SOURCE_REVISION=$(git rev-parse HEAD) python3 build.py
          python3 iv_release.py public ../history/published
          node test-price-model.js
          node test-technology.js
          python3 test_price_reference.py
          python3 test_technology_reference.py
          node test-cost-decomposition.js
          python3 -c 'from pathlib import Path; names=["analyst-cockpit.html","analyst-cockpit.js","plan-register.html","plan-register.js","public-plan-fact.html","public-plan-fact.js","deviation-monitor.html","deviation-monitor.js","plan-comparison.html","plan-comparison.js","plan-diagnostics.html","plan-diagnostics.js","plan-report.html","plan-report.js","chart-export.js","style.css","interface.js","layout.js"]; assert all((Path("public")/n).is_file() and (Path("public")/n).stat().st_size>0 for n in names), "Missing analytics publication asset"; print("Analytics assets:",len(names))'
          git rev-parse HEAD > public/source-version.txt
          cp public/source-version.txt public/version.txt
          python3 -c "import json; from pathlib import Path; d=json.loads(Path('public/quality.json').read_text()); print(d); assert not d['errors'],d['errors']"
      - name: Browser regression on saved data
        run: |
          cd monitor
          python3 -m pip install playwright==1.51.0
          cd public
          python3 -m http.server 8765 > /tmp/layout-http.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do if curl --silent --fail http://localhost:8765/index.html > /dev/null; then break; fi; sleep 1; done
          CHROME_BIN=$(command -v google-chrome) python3 ../test_chat_release_browser.py
          CHROME_BIN=$(command -v google-chrome) python3 ../test_global_browser.py
          CHROME_BIN=$(command -v google-chrome) python3 ../test_visual_system.py
          CHROME_BIN=$(command -v google-chrome) python3 ../test_iv_browser.py
      - name: Save offline quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-quality
          path: |
            monitor/public/quality.json
            monitor/visual-system-artifacts/
            monitor/v-browser-readiness.json
            monitor/public/data-manifest.json
          if-no-files-found: ignore
