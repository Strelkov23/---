name: FNS SME source schema
on:
  push:
    branches: [main]
    paths: ['site/sme_schema_probe.py','site/sme_classification.py','site/test_sme_classification.py','.github/workflows/sme-schema-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cd site
          python -m unittest test_sme_classification.py
          python sme_schema_probe.py --output ../sme-schema.json
          python sme_classification.py --members 12 --output ../sme-classification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sme-schema
          path: |
            sme-schema.json
            sme-classification.json
