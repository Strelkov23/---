name: FNS corporate archive pilot import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/company-import-check.yml','site/company_import.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source schemas and bounded sample import
        run: |
          cd site
          python -m unittest test_company_import.py
          python - <<'PY'
          import company_sources as c
          from pathlib import Path
          from datetime import datetime,timezone
          d=c.publish(Path(".."),Path("/nonexistent"),datetime.now(timezone.utc).isoformat(),True)
          assert all(r["schema_verified"] for r in d["rows"])
          PY
          python company_import.py --sources ../company-sources.json --output ../corporate-pilot --limit-members 1000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corporate-archive-pilot
          path: |
            corporate-pilot/company-pilot.json
            corporate-pilot/company-pilot.sqlite
            company-sources.json
          if-no-files-found: ignore
