name: Browser performance baseline
on:
  push:
    branches: [stage-g-performance-baseline]
    paths: ['.github/workflows/performance-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build saved archive
        run: |
          unzip -q EconomicsPages.zip -d monitor
          find site -maxdepth 1 -type f -exec cp -t monitor/ -- {} +
          mkdir -p monitor/data
          if test -f history/monitor.db.gz; then gzip -dc history/monitor.db.gz > monitor/data/monitor.db
          elif test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db
          else exit 1; fi
          python -m pip install openpyxl==3.1.5 pyarrow==20.0.0 xlrd==2.0.2 playwright==1.51.0
          cd monitor
          ECONOMIC_SOURCE_REVISION=$(git rev-parse HEAD) python build.py
      - name: Measure browser navigation and resources
        working-directory: monitor/public
        run: |
          python -m http.server 8765 >/tmp/performance-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/index.html >/dev/null
          python - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError
          routes = ["index.html","economic-map.html","company-atlas.html","papers.html","search.html","scenario.html","banks.html","historical.html","analyst-cockpit.html"]
          records=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path="/usr/bin/google-chrome",args=["--no-sandbox","--disable-dev-shm-usage"])
              for width,height in [(390,844),(1440,900)]:
                  for route in routes:
                      for trial in range(3):
                          context=browser.new_context(viewport={"width":width,"height":height})
                          page=context.new_page()
                          page.route("**/*", lambda r: r.continue_() if r.request.url.startswith("http://localhost:8765/") else r.abort())
                          # Disable routing before timing: routing disables browser HTTP cache.
                          page.unroute("**/*")
                          for phase in ("fresh_context","reload"):
                              errors=[]
                              def on_error(error): errors.append(str(error))
                              page.on("pageerror",on_error)
                              result={"route":route,"width":width,"trial":trial,"phase":phase}
                              start=time.perf_counter()
                              try:
                                  response=page.goto("http://localhost:8765/"+route,wait_until="load",timeout=30000) if phase=="fresh_context" else page.reload(wait_until="load",timeout=30000)
                                  if response is None or not response.ok: raise RuntimeError("Navigation failed")
                                  try: page.wait_for_load_state("networkidle",timeout=10000)
                                  except TimeoutError: result["network_idle_timeout"]=True
                                  result["elapsed_ms"]=round((time.perf_counter()-start)*1000)
                                  result.update(page.evaluate("""() => {const n=performance.getEntriesByType('navigation')[0],r=performance.getEntriesByType('resource');return {dom_ms:n.domContentLoadedEventEnd,load_ms:n.loadEventEnd,requests:r.length,transfer_bytes:r.reduce((a,x)=>a+x.transferSize,0)+n.transferSize,decoded_bytes:r.reduce((a,x)=>a+x.decodedBodySize,0)+n.decodedBodySize,dom_nodes:document.querySelectorAll('*').length}}"""))
                              except Exception as e: result["error"]=str(e)
                              finally:
                                  page.remove_listener("pageerror",on_error)
                                  result["page_errors"]=errors
                                  records.append(result)
                          context.close()
              browser.close()
          report={"revision":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"environment":"GitHub Actions localhost; no WAN latency or CPU throttling; reload may revalidate files","records":records}
          Path("../performance-baseline.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Measured records:",len(records),flush=True)
          assert len(records)==len(routes)*2*3*2
          assert not any(r.get("error") or r["page_errors"] for r in records),"Browser failure in performance sample"
          PY
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: monitor/performance-baseline.json
          if-no-files-found: error
