name: NAO investment source identifier audit
on:
  push:
    branches: [stage-f-nao-record-audit]
    paths: ['site/nao_record_audit.py','.github/workflows/nao-record-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install openpyxl==3.1.5
          cd site
          python nao_record_audit.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nao-record-audit
          path: nao-record-audit.json
