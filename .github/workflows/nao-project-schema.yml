name: NAO investment workbook schema
on:
  push:
    branches: [stage-f-nao-project-schema]
    paths: ['site/nao_project_schema.py','site/test_nao_project_schema.py','.github/workflows/nao-project-schema.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install openpyxl==3.1.5
          cd site
          python -m unittest test_nao_project_schema.py
          python nao_project_schema.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nao-project-schema
          path: nao-project-schema.json
          if-no-files-found: ignore
