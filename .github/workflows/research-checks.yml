name: Research platform checks
on:
  pull_request:
    branches: [main]
    paths: ['EconomicsPages.zip', 'site/**', '.github/workflows/research-checks.yml']
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          unzip -q EconomicsPages.zip -d monitor
          cp site/* monitor/
          mkdir -p monitor/data
          if test -f history/monitor.db.gz; then gzip -dc history/monitor.db.gz > monitor/data/monitor.db
          elif test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db; fi
          cd monitor
          python3 -m compileall -q .
          python3 -m pip install openpyxl==3.1.5 pyarrow==20.0.0
          python3 -m unittest test_budget_programmes.py test_annual_goals.py test_goals.py test_programmes.py test_catalogue.py test_research.py test_quality.py test_national.py test_historical.py test_industrial.py test_sector_passports.py
          for script in *.js; do node --check "$script"; done
          rm -rf public
          python3 build.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('public')
          for f in ('programmes.html','programmes.json','programmes.csv','programmes.js','national-goals.json','national-goals.csv','annual-goals.json','annual-goals.csv','programme-budget.json','programme-budget.csv','statistics.html','diagnostics.html','scenario.html','methodology.html','catalog.json','cbr.json','links.json','quality.json','research.js','national.html','national.json','national.js','404.html','archive/index.html','historical.html','historical.json','historical.js','regions/index.html','sector-passports.html','sector-passports.json','sector-passports.js','sector-passports/index.html'):
              assert (p/f).is_file(),f
          assert len(json.loads((p/'catalog.json').read_text())) >= 100
          errors=json.loads((p/'links.json').read_text())['internal_errors']
          assert not errors, errors
          report=json.loads((p/'quality.json').read_text())
          assert not report['errors'], report['errors']
          assert report['files']['compare.json']['sha256']
          PY
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation
          path: |
            monitor/public/quality.json
            monitor/public/links.json
          if-no-files-found: ignore
          retention-days: 14


      - name: Verify real public regional statistical files
        if: github.head_ref == 'stage-02-regional-schema' || github.event_name == 'workflow_dispatch'
        working-directory: monitor
        run: |
          python3 - <<'PY'
          import historical as h
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          tasks=[("vrp",h.DIRECT_FILES["GRP"])]
          tasks += [(n,h.MIRROR+"data_"+code+"_socio_economic_102_v20260313.zip") for n,code in h.REGIONAL_ZIPS.items()]
          def probe(task):
              name,url=task
              raw,_=h.get(url,35000000)
              rows=h.parse_vrp(raw) if name=="vrp" else h.mirror_rows(raw,name,selected=True)
              print("VERIFIED",name,len(rows),"observations",len({r["region"] for r in rows}),"territories",min(r["year"] for r in rows),max(r["year"] for r in rows),flush=True)
              for (title,unit),n in Counter((r["title"],r["unit"]) for r in rows).items():
                  print("SERIES",name,n,title,unit,flush=True)
              assert len(rows)>100 and len({r["region"] for r in rows})>50,name
              return rows
          with ThreadPoolExecutor(max_workers=2) as pool:
              results=list(pool.map(probe,tasks))
          assert len({r["indicator"] for r in results[0]})>=7
          print("TOTAL VERIFIED OBSERVATIONS",sum(map(len,results)),flush=True)
          PY

      - name: Verify persisted regional catalogue and browser comparisons
        if: github.head_ref == 'stage-02-regional-comparison' || github.event_name == 'workflow_dispatch'
        working-directory: monitor
        run: |
          python3 - <<'PY'
          import historical as h, sqlite3, json
          from pathlib import Path
          from unittest.mock import patch
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime,timezone
          tasks=[("vrp",h.DIRECT_FILES["GRP"])]
          tasks += [(n,h.MIRROR+"data_"+code+"_socio_economic_102_v20260313.zip") for n,code in h.REGIONAL_ZIPS.items()]
          def fetch(task):
              name,url=task
              raw,enc=h.get(url,35000000)
              return url,(raw,enc)
          with ThreadPoolExecutor(max_workers=2) as pool: cache=dict(pool.map(fetch,tasks))
          # Only verified files are served for this integration test. Other sources are deliberately offline.
          def get(url,limit):
              if url not in cache:raise ValueError("Source not part of this test")
              raw,enc=cache[url]
              assert len(raw)<=limit
              return raw,enc
          db=sqlite3.connect("regional-integration.db")
          stamp=datetime.now(timezone.utc).isoformat()
          out=Path("public")
          with patch("historical.get",side_effect=get):
              h.publish(db,stamp,out,True)
              count=db.execute("select count(*) from hist_values").fetchone()[0]
              h.publish(db,stamp,out,True)
              assert count==db.execute("select count(*) from hist_values").fetchone()[0],"Repeated import duplicated observations"
          db.close()
          catalog=json.loads((out/"historical.json").read_text())
          total=0
          for s in catalog["series"]:
              rows=json.loads((out/s["file"]).read_text())["values"]
              assert len(rows)==s["count"]==len({(r["region"],r["year"]) for r in rows})
              total+=len(rows)
          print("PERSISTED REGIONAL OBSERVATIONS",total,"SERIES",len(catalog["series"]),"DB BYTES",Path("regional-integration.db").stat().st_size,flush=True)
          assert total>=50000 and len(catalog["series"])>=25
          import gzip,shutil,hashlib
          with open("regional-integration.db","rb") as src,gzip.open("regional-integration.db.gz","wb",compresslevel=6) as dst:shutil.copyfileobj(src,dst)
          compressed=Path("regional-integration.db.gz").stat().st_size
          print("COMPRESSED DB BYTES",compressed,flush=True)
          assert compressed<85000000
          with gzip.open("regional-integration.db.gz","rb") as src,open("regional-restored.db","wb") as dst:shutil.copyfileobj(src,dst)
          with sqlite3.connect("regional-restored.db") as restored:
              assert restored.execute("pragma integrity_check").fetchone()[0]=="ok"
              assert restored.execute("select count(*) from hist_values").fetchone()[0]==count
          s=next(x for x in catalog["series"] if x["code"].startswith("GRP_") and x["title"]=="ВРП в текущих ценах")
          from urllib.parse import urlencode
          query=urlencode({"hist-series":s["code"],"hist-region":"Белгородская область","hist-peer":"Брянская область","hist-mode":"base","hist-from":"2016","hist-to":"2024","hist-rank-year":"2024"})
          Path("/tmp/regional-query.txt").write_text(query)
          PY
          cd public
          python3 -m http.server 8765 > /tmp/regional-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/historical.html > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "http://localhost:8765/historical.html?$(cat /tmp/regional-query.txt)" > /tmp/regional-dom.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path("/tmp/regional-dom.html").read_text()
          assert "совместных лет: 9" in s
          assert "2016 = 100" in s
          assert "Территорий в срезе:" in s
          assert "Разность A − B" in s
          print("REGIONAL BROWSER COMPARISON PASSED")
          PY
      - name: Check current public deployment
        if: always() && github.head_ref == 'stage-02-regional-comparison'
        continue-on-error: true
        run: |
          for route in version.txt historical.html historical.json quality.json regions/; do
            echo "PUBLIC $route"
            curl --silent --show-error --max-time 15 --location --output /tmp/public-check --write-out '%{http_code}\n' "https://strelkov23.github.io/---/$route" || true
            if test "$route" = version.txt; then head -c 100 /tmp/public-check || true; echo; fi
          done


      - name: Verify real industrial series and rendered explorer
        if: github.head_ref == 'stage-03-industry-atlas' || github.event_name == 'workflow_dispatch'
        working-directory: monitor
        run: |
          python3 - <<'PY'
          import industrial_data as d,sqlite3,json
          from pathlib import Path
          from unittest.mock import patch
          from datetime import datetime,timezone
          cache={}
          for filename in d.FILES:
              url=d.BASE+filename
              raw,enc=d.h.get(url,35000000)
              cache[url]=(raw,enc)
              rows=d.parse(raw,filename)
              print("VERIFIED INDUSTRY",filename,len(rows),"series",sum(len(s["values"]) for s in rows),"observations",flush=True)
          with sqlite3.connect("industrial-test.db") as db,patch("industrial_data.h.get",side_effect=lambda url,limit:cache[url]):
              warnings=d.publish(db,datetime.now(timezone.utc).isoformat(),Path("public"),True)
              assert not warnings,warnings
              first=db.execute("select count(*) from industrial_obs").fetchone()[0]
              d.publish(db,datetime.now(timezone.utc).isoformat(),Path("public"),True)
              assert first==db.execute("select count(*) from industrial_obs").fetchone()[0]
          data=json.loads(Path("public/industrial.json").read_text())
          total=sum(len(s["values"]) for s in data["series"])
          print("INDUSTRIAL TOTAL",len(data["series"]),total,flush=True)
          assert total>15000 and len(data["series"])>300
          s=next(s for s in data["series"] if s["kind"]=="Индекс производства г/г" and s["code"]=="C")
          Path("/tmp/industrial-query").write_text(s["id"])
          PY
          cd public
          python3 -m http.server 8765 > /tmp/industrial-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/industrial.html > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "http://localhost:8765/industrial.html?ind-series=$(cat /tmp/industrial-query)" > /tmp/industrial-dom.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path("/tmp/industrial-dom.html").read_text()
          assert "Наблюдений:" in s and "Копировать график" in s and "ОКВЭД2" in s
          assert "Координаты ячейки" in s
          print("INDUSTRIAL BROWSER PASSED")
          PY
          for route in version.txt historical.html historical.json industrial.html; do
            echo "PUBLIC $route"
            curl --silent --show-error --max-time 15 --location --output /tmp/public-check --write-out '%{http_code}\n' "https://strelkov23.github.io/---/$route" || true
            if test "$route" = version.txt; then head -c 100 /tmp/public-check || true; echo; fi
          done




      - name: Inspect statistical yearbook and test comparable industrial cross section
        if: github.head_ref == 'stage-03-assets-capacity'
        working-directory: monitor
        run: |
          python3 - <<'PY'
          import historical as h,industrial_data as d,openpyxl,io,sqlite3,json
          from pathlib import Path
          from unittest.mock import patch
          for name in ('Pril_Prom_2025.xlsx','Pril_Prom_2023.xlsx'):
              url='https://www.rosstat.gov.ru/storage/mediabank/'+name
              try:
                  raw,_=h.get(url,35000000)
                  w=openpyxl.load_workbook(io.BytesIO(raw),read_only=True,data_only=True)
                  print('YEARBOOK',name,len(raw),w.sheetnames[:150],flush=True)
                  for s in w:
                      if s.title.lower().strip() in ('содержание','оглавление','contents'):
                          for r in s.iter_rows(values_only=True,max_row=min(200,s.max_row or 200),max_col=8):
                              if any('фонд' in str(v).lower() or 'мощност' in str(v).lower() or 'рентабель' in str(v).lower() for v in r):print('INDEX',s.title,repr(r),flush=True)
                      else:
                          header=list(s.iter_rows(values_only=True,max_row=10,max_col=15))
                          title=' '.join(str(v).lower() for row in header[:5] for v in row[:4] if v is not None)
                          if any(x in title for x in ('степень износа','наличие основных фондов','рентабельность','использования среднегодовой','ввод в действие основных фондов','сальдированный финансовый результат')):
                              print('TARGET',name,s.title,flush=True)
                              for i,r in enumerate(header,1):print('ROW',i,repr(r)[:1200],flush=True)
                  w.close()
              except Exception as e:print('UNAVAILABLE',url,str(e),flush=True)
          filename='ind_baza_2023.xlsx';url=d.BASE+filename;raw,enc=h.get(url,35000000)
          with sqlite3.connect(':memory:') as db,patch.dict(d.FILES,{filename:d.FILES[filename]},clear=True),patch('industrial_data.h.get',return_value=(raw,enc)):
              assert not d.publish(db,'2026-11-24',Path('public'),True)
          data=json.loads(Path('public/industrial.json').read_text())
          s=next(s for s in data['series'] if s['kind']=='Индекс производства г/г' and s['code']=='C')
          Path('/tmp/industrial-query').write_text(s['id'])
          PY
          cd public
          python3 -m http.server 8765 > /tmp/industrial-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/industrial.html > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "http://localhost:8765/industrial.html?ind-series=$(cat /tmp/industrial-query)" > /tmp/cross-dom.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/cross-dom.html').read_text()
          m=re.search(r'Позиций в срезе: (\d+)',s)
          assert m and int(m[1])>50
          assert 'Индекс производства г/г' in s and 'Скачать срез CSV' in s
          print('INDUSTRIAL CROSS SECTION PASSED',m[1])
          PY

      - name: Check sector passports in browser
        if: github.head_ref == 'stage-03-sector-passports'
        working-directory: monitor/public
        run: |
          python3 -m http.server 8765 >/tmp/passport-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/sector-passports.html >/dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://localhost:8765/sector-passports.html?sp-sector=agriculture' >/tmp/sector-dom.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('sector-passports.json').read_text())
          assert len(d['profiles'])==14
          s=Path('/tmp/sector-dom.html').read_text()
          assert 'Показателей в выборке: 12' in s and 'NV.AGR.EMPL.KD' in s and 'Скачать паспорт CSV' in s
          print('SECTOR PASSPORTS PASSED',len(d['profiles']),len({r['id'] for p in d['profiles'] for r in p['rows']}))
          PY
          for route in version.txt industrial.html industrial.json historical.html; do
            echo "PUBLIC $route"
            curl --silent --show-error --max-time 15 --location --output /tmp/public-check --write-out '%{http_code}\n' "https://strelkov23.github.io/---/$route" || true
            if test "$route" = version.txt; then head -c 100 /tmp/public-check || true; echo; fi
          done
