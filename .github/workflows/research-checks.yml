name: Research platform checks
on:
  pull_request:
    branches: [main]
    paths: ['EconomicsPages.zip', 'site/**', '.github/workflows/research-checks.yml']
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          unzip -q EconomicsPages.zip -d monitor
          cp site/* monitor/
          mkdir -p monitor/data
          if test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db; fi
          cd monitor
          python3 -m compileall -q .
          python3 -m pip install openpyxl==3.1.5 pyarrow==20.0.0
          python3 -m unittest test_catalogue.py test_research.py test_quality.py test_national.py test_historical.py
          for script in *.js; do node --check "$script"; done
          rm -rf public
          python3 build.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('public')
          for f in ('statistics.html','diagnostics.html','scenario.html','methodology.html','catalog.json','cbr.json','links.json','quality.json','research.js','national.html','national.json','national.js','404.html','archive/index.html','historical.html','historical.json','historical.js','regions/index.html'):
              assert (p/f).is_file(),f
          assert len(json.loads((p/'catalog.json').read_text())) >= 100
          errors=json.loads((p/'links.json').read_text())['internal_errors']
          assert not errors, errors
          report=json.loads((p/'quality.json').read_text())
          assert not report['errors'], report['errors']
          assert report['files']['compare.json']['sha256']
          PY
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation
          path: |
            monitor/public/quality.json
            monitor/public/links.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Inspect public statistical source schemas
        continue-on-error: true
        working-directory: monitor
        run: |
          python3 - <<'PY'
          import historical as h,io,zipfile,openpyxl
          from concurrent.futures import ThreadPoolExecutor
          def probe(task):
              name,url=task
              try:
                  data,_=h.get(url,35000000)
                  print(name,"BYTES",len(data),flush=True)
                  if name=="VRP":
                      w=openpyxl.load_workbook(io.BytesIO(data),read_only=True,data_only=True)
                      for s in w:
                          print("WORKSHEET",repr(s.title),s.max_row,s.max_column,flush=True)
                          for i,r in enumerate(s.iter_rows(values_only=True,max_row=min(s.max_row or 20,15),max_col=min(s.max_column or 30,32)),1):
                              print("ROW",i,repr(r)[:1800],flush=True)
                  else:
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          for f in z.infolist()[:8]:
                              print(name,"MEMBER",f.filename,f.file_size,flush=True)
                              if f.filename.lower().endswith(".csv"):
                                  with z.open(f) as stream:
                                      for i in range(3):print(name,"CSV",stream.readline(6000).decode("utf-8-sig",errors="replace")[:2200],flush=True)
                              if f.filename.lower().endswith(".parquet"):
                                  import pyarrow.parquet as pq
                                  p=pq.ParquetFile(io.BytesIO(z.read(f)))
                                  print(name,"PARQUET",str(p.schema)[:2000],flush=True)
                                  print(name,"SAMPLE",repr(next(p.iter_batches(batch_size=2)).to_pylist())[:3000],flush=True)
              except Exception as e:print(name,type(e).__name__,str(e)[:300],flush=True)
          tasks=[("VRP","https://rosstat.gov.ru/storage/mediabank/VRP_s1998.xlsx")]
          tasks += [(n,h.MIRROR+"data_"+code+"_socio_economic_102_v20260313.zip") for n,code in (("grp","08"),("finance","19"),("industry","12"))]
          with ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(probe,tasks))
          PY
