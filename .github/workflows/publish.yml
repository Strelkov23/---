          python3 -c "from pathlib import Path; import json; d=json.loads(Path('sector-passports.json').read_text()); assert len(d['profiles'])==20 and {'light','chemical','pharma','metal','wood','materials'} <= {p['id'] for p in d['profiles']}; s=Path('/tmp/sector-dom.html').read_text(); p=next(x for x in d['profiles'] if x['id']=='agriculture'); assert ('Показателей в выборке: '+str(len(p['rows']))) in s; assert not any(r['count'] for r in p['rows']) or ('Наблюдений:' in s and '<svg' in s and 'Скачать SVG' in s)"
      - name: Check enterprise and bank publication
        working-directory: monitor/public
        run: |
          set -eu
          python3 -m http.server 8766 > /tmp/atlas-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8766/ > /dev/null
          for route in banks.html company-atlas.html bank-directory.js bank-directory.json bank-capital.js bank-capital.json bank-capital-history.js bank-capital-history.json bank-balance.js bank-balance.json bank-profit.js bank-profit.json sme-matrix.js sme-matrix.json sme-finance.js sme-finance.json company-lookup.js company-index.json sme-profile-index.json group-passports.js group-passports.json corporate-watch.json corporate-discovery.json; do
            curl --fail --silent "http://localhost:8766/$route" > /dev/null
          done
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          manifest = json.loads(Path('data-manifest.json').read_text())
          for name in ('bank-directory.json','bank-capital.json','bank-capital-history.json','bank-balance.json','bank-profit.json','sme-matrix.json','sme-finance.json','group-passports.json','company-index.json','corporate-watch.json','corporate-discovery.json'):
              raw = Path(name).read_bytes()
              entry = manifest['files'][name]
              assert len(raw) == entry['bytes'] and hashlib.sha256(raw).hexdigest() == entry['sha256'], name
              assert isinstance(json.loads(raw), dict), name
          assert Path('group-passports.json').read_bytes()==Path('../group-passports.json').read_bytes(), 'corporate snapshot differs from source'
          PY
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'http://localhost:8766/banks.html' > /tmp/banks-dom.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'http://localhost:8766/company-atlas.html' > /tmp/company-atlas-dom.html
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          class Status(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=None; self.values={}
              def handle_starttag(self,tag,attrs):
                  id=dict(attrs).get('id','')
                  if tag=='p' and id.endswith('-status'):
                      self.active=id; self.values[id]=''
              def handle_endtag(self,tag):
                  if tag=='p': self.active=None
              def handle_data(self,data):
                  if self.active: self.values[self.active]+=data
          def read(path):
              p=Status(); p.feed(Path(path).read_text()); return p.values
          b=read('/tmp/banks-dom.html')
          for id,prefix in {'bank-source-status':'Системно значимые:', 'bank-capital-status':'Дата:', 'bank-balance-status':'Срез ', 'bank-profit-status':'I квартал 2026', 'bank-history-status':'Отдельные отчётные даты'}.items():
              assert b.get(id,'').startswith(prefix), (id,b.get(id))
          a=read('/tmp/company-atlas-dom.html')
          assert a.get('group-status','').startswith('Документальный снимок'), a.get('group-status')
          assert a.get('group-cross-status','').startswith('Сопоставимых расчётов:'), a.get('group-cross-status')
          assert a.get('group-level-status','').startswith('Сопоставимые уровни:'), a.get('group-level-status')
          assert a.get('group-observation-status','').startswith('Наблюдений:'), a.get('group-observation-status')
          paired=json.loads(Path('sme-finance.json').read_text())
          expected='Парные наблюдения' if paired.get('paired_sums_version')==1 else 'Парные суммы'
          assert a.get('sme-pair-status','').startswith(expected), a.get('sme-pair-status')
          assert b.get('bank-coverage-status','').startswith(('Все три формы проверены','Общая выборка не подтверждена')), b.get('bank-coverage-status')
          assert b.get('bank-ratio-status','').startswith('Сопоставимых значений:'), b.get('bank-ratio-status')
          assert b.get('bank-profit-ratio-status','').startswith('Сопоставимых отношений:'), b.get('bank-profit-ratio-status')
          for name,id,yes,no in [('sme-matrix.json','sme-matrix-status','Диагностический срез','Диагностическая матрица пока недоступна.'),('sme-finance.json','sme-finance-status','Финансовый год:','Финансово-отраслевая диагностика пока не опубликована.')]:
              d=json.loads(Path(name).read_text())
              assert a.get(id,'').startswith(yes if d['status']=='diagnostic' else no), (id,a.get(id))
          PY
      - name: Audit responsive layout
        working-directory: monitor/public
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m http.server 8765 > /tmp/layout-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/ > /dev/null
          CHROME_BIN=$(command -v google-chrome) python3 ../test_global_browser.py
          CHROME_BIN=$(command -v google-chrome) python3 ../test_visual_system.py
          CHROME_BIN=$(command -v google-chrome) python3 ../test_iv_browser.py
          CHROME_BIN=$(command -v google-chrome) python3 ../layout_audit.py http://localhost:8765/ /tmp/layout-audit
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            monitor/public/quality.json
            monitor/public/links.json
            /tmp/*-dom.html
            /tmp/layout-audit/
            monitor/v-browser-readiness.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save updated history
        id: archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p history/published
          cp monitor/public/*.json history/published/
          cp monitor/public/federal-budget.csv history/published/
          if [ -f monitor/public/regional-boundaries.geojson ]; then cp monitor/public/regional-boundaries.geojson history/published/; fi
          mkdir -p history/published/regional-data
          cp -a monitor/public/regional-data/. history/published/regional-data/
          # Archive the exact sharded index (or remove stale shards when not published).
          rm -rf history/published/company-names
          if [ -d monitor/public/company-names ]; then
            cp -a monitor/public/company-names history/published/company-names
          fi
          rm -rf history/published/company-index
          if [ -d monitor/public/company-index ]; then
            cp -a monitor/public/company-index history/published/company-index
          fi
          # Keep optional SME profile shards together with their exact manifest.
          rm -rf history/published/sme-profile-index
          if [ -d monitor/public/sme-profile-index ]; then
            cp -a monitor/public/sme-profile-index history/published/sme-profile-index
          fi
          # SQLite is restored losslessly at the next build. Do not commit a raw database over GitHub's 100 MiB limit.
          gzip -n -c history/monitor.db > history/monitor.db.gz.tmp
          gzip -t history/monitor.db.gz.tmp
          test "$(stat -c %s history/monitor.db.gz.tmp)" -lt 95000000
          mv history/monitor.db.gz.tmp history/monitor.db.gz
          rm history/monitor.db
          git add -A history
          if ! git diff --cached --quiet; then
            git commit -m 'Update economic archive'
            # A code-only merge while the refresh runs must not invalidate the archive commit.
            # If history itself changed concurrently, stop rather than overwrite observations.
            base=$(cat /tmp/economic-source-revision)
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              if ! git merge-base --is-ancestor "$base" origin/main || ! git diff --quiet "$base" origin/main -- history/; then
                echo 'Archive changed concurrently; refusing to overwrite it' >&2
                exit 1
              fi
              git rebase origin/main
            done
            test "$pushed" = 1
          fi
          # Source and archived data revisions are distinct. The archive commit must contain exactly the published manifest.
          cmp /tmp/economic-source-revision monitor/public/source-version.txt
          git show HEAD:history/published/data-manifest.json | cmp - monitor/public/data-manifest.json
          python3 - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          manifest=json.loads(Path('monitor/public/data-manifest.json').read_text())
          for name,entry in manifest['files'].items():
              data=subprocess.check_output(['git','show','HEAD:history/published/'+name])
              assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256'],name
          index=json.loads(Path('monitor/public/company-index.json').read_text())
          if index['status']=='ready':
              for name,entry in index['files'].items():
                  data=subprocess.check_output(['git','show','HEAD:history/published/'+name])
                  assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256'],name
              print('Exact archived company shards verified:',len(index['files']))
          names=json.loads(Path('monitor/public/company-names.json').read_text())
          if names['status']=='ready':
              for name,entry in names['files'].items():
                  data=subprocess.check_output(['git','show','HEAD:history/published/'+name])
                  assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256'],name
          profiles=json.loads(Path('monitor/public/sme-profile-index.json').read_text())
          if profiles['status']=='diagnostic':
              for name,entry in profiles['files'].items():
                  data=subprocess.check_output(['git','show','HEAD:history/published/'+name])
                  assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256'],name
              print('Exact archived SME profile shards verified:',len(profiles['files']))
          else:
              assert profiles['status']=='not_deployed' and not Path('history/published/sme-profile-index').exists()
          print('Exact archived files verified:',len(manifest['files']))
          PY
          git rev-parse HEAD > monitor/public/version.txt
          echo "version=$(cat monitor/public/version.txt)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum monitor/public/data-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          analytics_sha256=$(python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          names=["analyst-cockpit.html","analyst-cockpit.js","plan-register.html","plan-register.js","public-plan-fact.html","public-plan-fact.js","deviation-monitor.html","deviation-monitor.js","plan-comparison.html","plan-comparison.js","plan-diagnostics.html","plan-diagnostics.js","plan-report.html","plan-report.js","chart-export.js","style.css","interface.js","layout.js","papers.html","papers.js","literature.json","literature-quality.html","literature-quality.json","literature-journals.csv","literature-years.csv","literature-topics.csv","journal-evidence.json","iv-lab.html","independent-statistics.html","iv-comparison.html","iv-lab-nav.js","iv-scenario-store.js","iv-energy-structure.js","iv-origin.js","iv-ember.js","iv-methods.js","iv-tech.js","iv-trajectory.js","iv-allocation.js","iv-workspaces.js","iv-physical-composite.js","iv-physical.js","iv-comparison.js","iv-evidence.js","iv-policy.js","iv-prices.js","iv-labour.js","iv-trade.js","iv-pulse.js","iv-lab.js","independent-trade.json","independent-ember.json","independent-prices.json","independent-labour.json","independent-physical.json"]
          print(json.dumps({n:hashlib.sha256((Path("monitor/public")/n).read_bytes()).hexdigest() for n in names},separators=(",",":")))
          PY
          )
          echo "analytics_sha256=$analytics_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: monitor/public
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          EXPECTED_ANALYTICS_SHA256: ${{ needs.build.outputs.analytics_sha256 }}
        run: |
          set -eu
          base="${PAGE_URL%/}/"
          test -n "$EXPECTED_VERSION"
          # CDN propagation can lag behind a successful deploy.
          for attempt in 1 2 3 4 5 6; do
            actual=$(curl --silent --fail --max-time 20 "${base}version.txt?build=$EXPECTED_VERSION" || true)
            if test "$actual" = "$EXPECTED_VERSION"; then break; fi
            sleep 10
          done
          test "$actual" = "$EXPECTED_VERSION"
          for route in normalized-data.html normalized-observations.json source-journal.html source-journal.json source-pipeline.html source-pipeline.json data-infrastructure.html data-infrastructure.json journal-evidence.html journal-evidence.json research-projects.html research-projects.js literature-quality.html literature-quality.json literature-journals.csv literature-years.csv literature-topics.csv diagnostic-backtest.html diagnostic-backtest.js investment-diagnostics.js dependency-diagnostics.js planning-centre.html balance-audit.html balance-audit.json balance-audit.csv plan-feasibility.html plan-feasibility.js horizon-feasibility.html horizon-feasibility.js cost-decomposition.html cost-decomposition.js territorial-plan.html territorial-plan.js; do
            curl --retry 2 --retry-all-errors --max-time 25 --silent --show-error --fail "${base}$route?build=$EXPECTED_VERSION" > /dev/null
          done
          for route in industrial-parks.html industrial-parks.js industrial-parks.json industrial-parks.csv park-certificates.js park-certificates.json park-certificates.csv regional-manufacturing.html regional-manufacturing.json regional-manufacturing.csv regional-manufacturing.js regional-mining-energy.json regional-mining-energy.csv federal-budget.html federal-budget.json federal-budget.csv federal-budget.svg finance-workbooks.html finance-workbooks.json finance-workbooks.csv finance-reconciliation.csv rosstat-workbooks.html rosstat-workbooks.json rosstat-workbooks.csv freshness.html freshness.json stat-revisions.html stat-revisions.json district-map.html district-meta.json sme-regions.json programmes.html programme-budget.json health-projects.json budget-diagnostics.html budget-diagnostics.json programme-evidence.html programme-evidence.json programme-evidence.csv programme-evidence.md labor.html labor-data.json labor-broad.csv labor-regional.csv labor-coefficients-template.csv labor-data.js labor-calibration.js prices.html price-data.json price-coefficients.csv labor-hours-template.csv price-model.js technology.html technology.js forecast.html forecast.js forecast.json forecast.csv forecast-backtests.csv capital.html capital-data.js capital-data.json fixed-assets.csv capacity-utilization.csv data-registry.html data-registry.js data-registry.json data-registry.csv method-passports.html method-passports.csv method-passports.json wdi-metadata.json data-manifest.json reproducibility.html provenance.js reproducibility.js source-version.txt index-builder.html index-builder.js composite-index.js report-builder.html report-builder.js finance.html finance-data.js finance-data.json finance-profitability.csv financial-state.html financial-state.js financial-state.json organization-debt.csv organization-results.csv cost-structure.html cost-structure.js cost-structure.json cost-structure.csv food-balance.html food-balance.js food-balance.json food-balance.csv economic-map.html news-map.html news-map.js archive.json regional-boundaries.geojson facility-map.html facility-energy.json search.html site-search.json glossary.html monitoring.html data-centre.html sectors.html analysis-centre.html research-centre.html quality-centre.html index.html statistics.html national.html historical.html historical.json industrial.html industrial.json industrial/ sector-passports.html sector-passports.json sector-passports/ papers.html atlas.html methodology.html links.html quality.json 404.html archive/ regions/ history/ budget/; do
            curl --retry 2 --retry-all-errors --max-time 25 --silent --show-error --fail "${base}$route" > /dev/null
          done
          for route in banks.html company-atlas.html bank-directory.js bank-directory.json bank-capital.js bank-capital.json bank-capital-history.js bank-capital-history.json bank-balance.js bank-balance.json bank-profit.js bank-profit.json sme-matrix.js sme-matrix.json sme-finance.js sme-finance.json company-lookup.js company-index.json group-passports.js group-passports.json corporate-watch.json corporate-discovery.json; do
            curl --retry 2 --retry-all-errors --max-time 25 --silent --show-error --fail "${base}$route" > /dev/null
          done
          for route in project-coverage.html project-search.js project-coverage.json project-coverage.csv project-breakdown.csv investment-projects.html investment-projects.json investment-projects.csv amur-projects.html amur-projects.json amur-projects.csv krasnodar-projects.html krasnodar-projects.json krasnodar-projects.csv nao-projects.html nao-projects.json nao-projects.csv; do
            curl --retry 2 --retry-all-errors --max-time 25 --silent --show-error --fail "${base}$route?build=$EXPECTED_VERSION" > /dev/null
          done
          export VERIFY_BASE="$base"
          python3 - <<'PY'
          import hashlib,json,os,time
          from urllib.request import urlopen,Request
          from urllib.parse import urljoin
          base=os.environ["VERIFY_BASE"]
          version=os.environ["EXPECTED_VERSION"]
          def get(name,expected_hash,expected_size=None):
              for attempt in range(4):
                  try:
                      url=urljoin(base,name)+"?build="+version
                      with urlopen(Request(url,headers={"Cache-Control":"no-cache"}),timeout=35) as response:
                          if response.geturl().split("?")[0]!=url.split("?")[0]:raise ValueError("Unexpected redirect")
                          raw=response.read(32*1024*1024+1)
                      if len(raw)>32*1024*1024 or (expected_size is not None and len(raw)!=expected_size) or hashlib.sha256(raw).hexdigest()!=expected_hash:raise ValueError("Public content differs from build")
                      return raw
                  except (OSError,ValueError) as exc:
                      if attempt==3:raise RuntimeError(name) from exc
                      time.sleep(5)
          manifest=json.loads(get("data-manifest.json",os.environ["EXPECTED_MANIFEST_SHA256"]))
          names=("project-coverage.json","investment-projects.json","amur-projects.json","krasnodar-projects.json","nao-projects.json","bank-directory.json","bank-capital.json","bank-balance.json","bank-profit.json","group-passports.json","company-index.json","sme-finance.json","sme-profile-index.json","corporate-watch.json","corporate-discovery.json","bank-archive-summary.json")
          for name in names:
              entry=manifest["files"][name]
              json.loads(get(name,entry["sha256"],entry["bytes"]))
          for name in ("normalized-observations.json","source-journal.json","source-pipeline.json","data-infrastructure.json","journal-evidence.json","literature-quality.json"):
              entry=manifest["files"][name]
              json.loads(get(name,entry["sha256"],entry["bytes"]))
          entry=manifest["files"]["sme-profile-index.json"]
          profiles=json.loads(get("sme-profile-index.json",entry["sha256"],entry["bytes"]))
          if profiles["status"]=="diagnostic":
              # Sample deterministic edge/middle blocks and largest compressed block.
              files=profiles["files"];keys=sorted(files)
              assert len(keys)==512
              sample={keys[0],keys[255],keys[-1],max(keys,key=lambda name:files[name]["bytes"])}
              for name in sorted(sample):
                  info=files[name];get(name,info["sha256"],info["bytes"])
              print("Public SME profile sample verified:",len(sample))
          else:
              assert profiles["status"]=="not_deployed"
          entry=manifest["files"]["federal-budget.csv"]
          get("federal-budget.csv",entry["sha256"],entry["bytes"])
          analytics=json.loads(os.environ["EXPECTED_ANALYTICS_SHA256"])
          expected_names=["analyst-cockpit.html","analyst-cockpit.js","plan-register.html","plan-register.js","public-plan-fact.html","public-plan-fact.js","deviation-monitor.html","deviation-monitor.js","plan-comparison.html","plan-comparison.js","plan-diagnostics.html","plan-diagnostics.js","plan-report.html","plan-report.js","chart-export.js","style.css","interface.js","layout.js","papers.html","papers.js","literature.json","literature-quality.html","literature-quality.json","literature-journals.csv","literature-years.csv","literature-topics.csv","journal-evidence.json","iv-lab.html","independent-statistics.html","iv-comparison.html","iv-lab-nav.js","iv-scenario-store.js","iv-energy-structure.js","iv-origin.js","iv-ember.js","iv-methods.js","iv-tech.js","iv-trajectory.js","iv-allocation.js","iv-workspaces.js","iv-physical-composite.js","iv-physical.js","iv-comparison.js","iv-evidence.js","iv-policy.js","iv-prices.js","iv-labour.js","iv-trade.js","iv-pulse.js","iv-lab.js","independent-trade.json","independent-ember.json","independent-prices.json","independent-labour.json","independent-physical.json"]
          assert set(analytics)==set(expected_names),"Incomplete analytics hash manifest"
          for name in expected_names:
              get(name,analytics[name])
          print("Exact public analytics files verified:",len(analytics))
          print("Exact public manifest and atlas files verified:",len(names)+7)
          PY
          echo "Public version verified: $EXPECTED_VERSION"
