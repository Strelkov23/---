name: Economic monitor
on:
  push:
    branches: [main]
    paths: ['EconomicsPages.zip', 'site/**', '.github/workflows/publish.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  group: economic-monitor
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.archive.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore archive and build
        run: |
          unzip -q EconomicsPages.zip -d monitor
          cp site/* monitor/
          mkdir -p history monitor/data
          if test -f history/monitor.db.gz; then gzip -dc history/monitor.db.gz > monitor/data/monitor.db
          elif test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db; fi
          cd monitor
          python3 -m pip install openpyxl==3.1.5 pyarrow==20.0.0
          python3 -m unittest test_catalogue.py test_research.py test_quality.py test_national.py test_historical.py test_industrial.py test_sector_passports.py test_navigation.py test_regional_geo.py
          python3 -m compileall -q .
          for script in *.js; do node --check "$script"; done
          node test-regional-disparities.js
          node test-regional-map.js
          node test-chain-stress.js
          rm -rf public
          python3 build.py --refresh
          git rev-parse HEAD > public/version.txt
          python3 -c "import sqlite3; s=sqlite3.connect('data/monitor.db'); d=sqlite3.connect('../history/monitor.db'); s.backup(d); d.close(); s.close()"
      - name: Check rendered analyst dashboard
        working-directory: monitor/public
        run: |
          python3 -m http.server 8765 > /tmp/monitor-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/ > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/?q=налог' > /tmp/monitor-dom.html
          python3 -c "from pathlib import Path; s=Path('/tmp/monitor-dom.html').read_text(); assert 'Найдено материалов: ' in s and 'Изменение валового выпуска:' in s and 'Не удалось загрузить данные' not in s"
          google-chrome --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/?q=инвестиции' > /tmp/mobile.html
          python3 -c "from pathlib import Path; s=Path('/tmp/mobile.html').read_text(); assert 'Найдено материалов: ' in s and 'Межотраслевой сценарий' in s and 'primary-nav' in s and 'Выберите направление работы' in s"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/papers.html' > /tmp/papers-dom.html
          python3 -c "from pathlib import Path; import json; s=Path('/tmp/papers-dom.html').read_text(); d=json.loads(Path('literature.json').read_text()); a=d['articles']; assert len(d['registry']) >= 13 and 'Найдено статей:' in s and 'paper-meta' in s and 'В общей подборке:' in s and (not a or ('https://doi.org/' in s and 'В подборку' in s)); assert Path('indicator-NY.GDP.MKTP.KD.ZG.html').exists()"
          google-chrome --headless --no-sandbox --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/desk.html' > /tmp/desk.html
          google-chrome --headless --no-sandbox --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/compare.html?begin=2010&finish=2020' > /tmp/pair.html
          python3 -c "from pathlib import Path; assert 'Найдено материалов: ' in Path('/tmp/desk.html').read_text(); s=Path('/tmp/pair.html').read_text(); assert 'Совместных наблюдений:' in s or 'За выбранный период общих наблюдений нет.' in s"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/statistics.html' > /tmp/statistics-dom.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/diagnostics.html' > /tmp/diagnostics-dom.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/scenario.html' > /tmp/scenario-dom.html
          python3 -c "from pathlib import Path; import json; assert len(json.loads(Path('catalog.json').read_text())) >= 100; assert 'Показателей: ' in Path('/tmp/statistics-dom.html').read_text(); assert 'Рассчитано наблюдений:' in Path('/tmp/diagnostics-dom.html').read_text(); assert 'Групп выше условного предела:' in Path('/tmp/scenario-dom.html').read_text() and 'максимальная доля единого сценария:' in Path('/tmp/scenario-dom.html').read_text(); assert Path('supplier-dependencies.csv').exists()"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/national.html' > /tmp/national-dom.html
          python3 -c "from pathlib import Path; import json; p=Path('.'); assert len(json.loads((p/'national.json').read_text())) == 13; assert 'Наблюдений:' in Path('/tmp/national-dom.html').read_text()"
          for route in monitoring.html data-centre.html sectors.html analysis-centre.html research-centre.html quality-centre.html index.html papers.html statistics.html national.html methodology.html links.html diagnostics.html scenario.html atlas.html directory.html laws.html compare.html desk.html week.html 404.html archive/ stats/ model/ papers/; do curl --fail --silent "http://localhost:8765/$route" > /dev/null; done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/historical.html' > /tmp/historical-dom.html
          python3 -c "from pathlib import Path; s=Path('/tmp/historical-dom.html').read_text(); assert 'обнаруженных официальных файлов' in s and 'Казначейство' in s and 'ЕМИСС' in s and 'Сопоставление показателей территории' in s and 'rc-base' in s and 'Межрегиональное неравенство и диспропорции' in s and 'rd-panel' in s and 'geo-form' in s and 'Загрузка географической базы…' not in s and 'Каталог диагностики недоступен.' not in s and 'Загрузка каталога…' not in s and 'Каталог сопоставления недоступен.' not in s; import json; d=json.loads(Path('historical.json').read_text()); assert not d['series'] or ('Тепловая карта динамики' in s and 'Сравнение территорий ·' in s)"
          for route in historical.html historical/ regions/ history/ budget/ historical.json regional-boundaries.json; do curl --fail --silent "http://localhost:8765/$route" > /dev/null; done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://localhost:8765/industrial.html' > /tmp/industrial-dom.html
          python3 -c "from pathlib import Path; import json; d=json.loads(Path('industrial.json').read_text()); s=Path('/tmp/industrial-dom.html').read_text(); assert 'Источников' in s and (not d['series'] or 'Наблюдений:' in s)"
          curl --fail --silent http://localhost:8765/industrial/ > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom 'http://localhost:8765/sector-passports.html?sp-sector=agriculture' > /tmp/sector-dom.html
          python3 -c "from pathlib import Path; import json; d=json.loads(Path('sector-passports.json').read_text()); assert len(d['profiles'])==14; s=Path('/tmp/sector-dom.html').read_text(); assert 'Показателей в выборке: 12' in s; p=next(x for x in d['profiles'] if x['id']=='agriculture'); assert not any(r['count'] for r in p['rows']) or ('Наблюдений:' in s and '<svg' in s and 'Скачать SVG' in s)"
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            monitor/public/quality.json
            monitor/public/links.json
            /tmp/*-dom.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Save updated history
        id: archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p history/published
          cp monitor/public/*.json history/published/
          if [ -f monitor/public/regional-boundaries.geojson ]; then cp monitor/public/regional-boundaries.geojson history/published/; fi
          mkdir -p history/published/regional-data
          cp -a monitor/public/regional-data/. history/published/regional-data/
          # SQLite is restored losslessly at the next build. Do not commit a raw database over GitHub's 100 MiB limit.
          gzip -n -c history/monitor.db > history/monitor.db.gz.tmp
          gzip -t history/monitor.db.gz.tmp
          test "$(stat -c %s history/monitor.db.gz.tmp)" -lt 95000000
          mv history/monitor.db.gz.tmp history/monitor.db.gz
          rm history/monitor.db
          git add -A history
          if ! git diff --cached --quiet; then
            git commit -m 'Update economic archive'
            # A code-only merge while the refresh runs must not invalidate the archive commit.
            # If history itself changed concurrently, stop rather than overwrite observations.
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              if git diff --name-only HEAD^ origin/main -- history/ | grep -q .; then
                echo 'Archive changed concurrently; refusing to overwrite it' >&2
                exit 1
              fi
              git rebase origin/main
            done
            test "$pushed" = 1
          fi
          git rev-parse HEAD > monitor/public/version.txt
          echo "version=$(cat monitor/public/version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: monitor/public
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          base="${PAGE_URL%/}/"
          test -n "$EXPECTED_VERSION"
          # CDN propagation can lag behind a successful deploy.
          for attempt in 1 2 3 4 5 6; do
            actual=$(curl --silent --fail --max-time 20 "${base}version.txt?build=$EXPECTED_VERSION" || true)
            if test "$actual" = "$EXPECTED_VERSION"; then break; fi
            sleep 10
          done
          test "$actual" = "$EXPECTED_VERSION"
          for route in monitoring.html data-centre.html sectors.html analysis-centre.html research-centre.html quality-centre.html index.html statistics.html national.html historical.html historical.json industrial.html industrial.json industrial/ sector-passports.html sector-passports.json sector-passports/ papers.html atlas.html methodology.html links.html quality.json 404.html archive/ regions/ history/ budget/; do
            curl --retry 2 --retry-all-errors --max-time 25 --silent --show-error --fail "${base}$route" > /dev/null
          done
          echo "Public version verified: $EXPECTED_VERSION"
