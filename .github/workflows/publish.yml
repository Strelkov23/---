name: Economic monitor
on:
  push:
    branches: [main]
    paths: ['EconomicsPages.zip', 'site/**', '.github/workflows/publish.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  group: economic-monitor
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore archive and build
        run: |
          unzip -q EconomicsPages.zip -d monitor
          cp site/* monitor/
          mkdir -p history
          if test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db; fi
          cd monitor
          python3 -m unittest test_catalogue.py test_research.py
          python3 -m compileall -q .
          for script in *.js; do node --check "$script"; done
          python3 build.py --refresh
          git rev-parse HEAD > public/version.txt
          python3 -c "import sqlite3; s=sqlite3.connect('data/monitor.db'); d=sqlite3.connect('../history/monitor.db'); s.backup(d); d.close(); s.close()"
      - name: Check rendered analyst dashboard
        working-directory: monitor/public
        run: |
          python3 -m http.server 8765 > /tmp/monitor-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/ > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/?q=налог' > /tmp/monitor-dom.html
          python3 -c "from pathlib import Path; s=Path('/tmp/monitor-dom.html').read_text(); assert 'Найдено материалов: 0' not in s and 'Найдено материалов: ' in s and '<svg ' in s and '<tbody><tr>' in s and 'Изменение валового выпуска:' in s"
          google-chrome --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/?q=инвестиции&publisher=ПРАЙМ&start=2026-11-20&end=2026-11-20' > /tmp/mobile.html
          python3 -c "from pathlib import Path; s=Path('/tmp/mobile.html').read_text(); assert 'Танзания' in s and 'Найдено материалов: 0' not in s and '2026-09' in s"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/papers.html' > /tmp/papers-dom.html
          python3 -c "from pathlib import Path; import json; s=Path('/tmp/papers-dom.html').read_text(); a=json.loads(Path('literature.json').read_text())['articles']; assert a and 'Найдено статей:' in s and 'https://doi.org/' in s; assert '<svg' in Path('indicator-NY.GDP.MKTP.KD.ZG.html').read_text()"
          google-chrome --headless --no-sandbox --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/desk.html?words=инвестиц' > /tmp/desk.html
          google-chrome --headless --no-sandbox --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/compare.html?begin=2010&finish=2020' > /tmp/pair.html
          python3 -c "from pathlib import Path; assert 'В подборку</button>' in Path('/tmp/desk.html').read_text(); s=Path('/tmp/pair.html').read_text(); assert 'Совместных наблюдений: 11' in s and s.count('<svg') == 2"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/statistics.html' > /tmp/statistics-dom.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/diagnostics.html' > /tmp/diagnostics-dom.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/scenario.html' > /tmp/scenario-dom.html
          python3 -c "from pathlib import Path; import json; assert len(json.loads(Path('catalog.json').read_text())) >= 100; assert 'Показателей: ' in Path('/tmp/statistics-dom.html').read_text(); assert 'Рассчитано наблюдений:' in Path('/tmp/diagnostics-dom.html').read_text(); assert 'Групп выше условного предела:' in Path('/tmp/scenario-dom.html').read_text()"
      - name: Save updated history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p history/published
          cp monitor/public/*.json history/published/
          git add history/monitor.db history/published
          if ! git diff --cached --quiet; then git commit -m 'Update economic archive'; git push; fi
          git rev-parse HEAD > monitor/public/version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: monitor/public
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
