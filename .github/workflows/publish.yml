name: Economic monitor
on:
  push:
    branches: [main]
    paths: ['EconomicsPages.zip', 'site/**', '.github/workflows/publish.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['FNS full SME classification']
    branches: [main]
    types: [completed]
concurrency:
  group: economic-monitor
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.archive.outputs.version }}
      manifest_sha256: ${{ steps.archive.outputs.manifest_sha256 }}
      analytics_sha256: ${{ steps.archive.outputs.analytics_sha256 }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record checked out source revision
        run: git rev-parse HEAD > /tmp/economic-source-revision
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest complete diagnostic SME artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/sme-source
          # Select a consistent pair from successful runs, preferring a newer edition
          # and, for the same edition, the richer validated schema.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sme-full-import.yml --branch main --status success --limit 12 --json databaseId --jq '.[].databaseId') || ids=""
          best=""
          for id in $ids; do
            folder=$(mktemp -d)
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name sme-full-classification --dir "$folder" &&
               score=$(python3 site/sme_artifact.py "$folder" --financial-index history/published/company-index.json); then
              if [[ -z "$best" || "$score" > "$best" ]]; then
                rm -rf /tmp/sme-source/sme-profile-index /tmp/sme-source/sme-profile-index.json
                cp "$folder/classification.json" "$folder/finance-join.json" /tmp/sme-source/
                if test "${score##* }" -ge 4; then
                  cp "$folder/sme-profile-index.json" /tmp/sme-source/
                  cp -a "$folder/sme-profile-index" /tmp/sme-source/
                fi
                best="$score"
                echo "Selected diagnostic artifact from run $id ($score)"
              fi
              # A current-edition enriched candidate is sufficient.
              if [[ "$score" == "$(date -u +%Y-%m)-10 6" ]]; then
                rm -rf "$folder"
                break
              fi
            fi
            rm -rf "$folder"
          done
          if ! test -s /tmp/sme-source/classification.json; then
            echo "No complete diagnostic artifact; use validated archived data when compatible."
          fi
      - name: Restore verified official bank archive diagnostic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/bank-archive-source
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bank-report-probe.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty') || id=""
          if [ -n "$id" ]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name bank-form-123-source-structure --dir /tmp/bank-archive-source || true
          fi
      - name: Restore archive and build
        env:
          BANK_ARCHIVE_SOURCE: /tmp/bank-archive-source
          SME_FINANCE_REPORT: /tmp/sme-source/finance-join.json
          SME_MATRIX_REPORT: /tmp/sme-source/classification.json
          SME_PROFILE_SOURCE: /tmp/sme-source
        run: |
          unzip -q EconomicsPages.zip -d monitor
          # The artifact preflight imports Python modules and can create site/__pycache__.
          # Copy only top-level regular source files, never generated directories.
          find site -maxdepth 1 -type f -exec cp -t monitor/ -- {} +
          test -f monitor/build.py
          mkdir -p history monitor/data
          if test -f history/monitor.db.gz; then gzip -dc history/monitor.db.gz > monitor/data/monitor.db
          elif test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db; fi
          cd monitor
          python3 -m pip install openpyxl==3.1.5 pyarrow==20.0.0 xlrd==2.0.2
          python3 -m unittest test_independent_trade.py test_independent_ember.py test_iv_release.py test_literature_resume.py test_literature_coverage.py test_nao_project_public.py test_nao_project_import.py test_nao_column_audit.py test_nao_project_schema.py test_sme_profile_public.py test_sme_profile_index.py test_bank_form_queue.py test_journal_evidence.py test_source_acceptance.py test_source_contract.py test_sme_classification.py test_sme_full_import.py test_sme_finance_join.py test_federal_budget.py test_rosstat_workbooks.py test_finance_workbooks.py test_link_recovery.py test_consistency.py test_stat_revisions.py test_freshness.py test_district_geo.py test_sme_regions.py test_facility_data.py test_electricity_balance.py test_food_balance.py test_cost_structure.py test_financial_state.py test_finance_data.py test_provenance.py test_wdi_metadata.py test_method_passports.py test_capital_data.py test_forecast.py test_labor_data.py test_balance_audit.py test_programme_evidence.py test_budget_diagnostics.py test_budget_programmes.py test_annual_goals.py test_goals.py test_programmes.py test_catalogue.py test_research.py test_quality.py test_national.py test_historical.py test_industrial.py test_sector_passports.py test_navigation.py test_regional_geo.py test_regional_manufacturing.py test_regional_industry_extra.py test_industrial_parks.py test_park_certificates.py test_investment_projects.py test_amur_projects.py test_krasnodar_projects.py test_project_coverage.py test_enterprise_sources.py test_amur_enterprises.py test_bank_registry.py test_bank_disclosure.py test_bank_report_probe.py test_bank_capital.py test_bank_capital_history.py test_bank_balance.py test_bank_profit.py test_company_sources.py test_company_import.py test_company_index.py test_company_names.py test_sme_finance_public.py test_sme_artifact.py test_group_passports.py test_corporate_watch.py test_corporate_discovery.py
          python3 -m compileall -q .
          for script in *.js; do node --check "$script"; done
          node test-regional-disparities.js
          node test-regional-map.js
          node test-regional-dashboard.js
          node test-regional-manufacturing.js
          node test-territorial-plan.js
          node test-industrial-parks.js
          node test-park-certificates.js
          node test-news-map.js
          node test-site-search.js
          node test-interface.js
          node test-workspace.js
          node test-iv-lab.js
          node test-iv-policy.js
          node test-iv-lab-nav.js
          node test-iv-scenario-store.js
          node test-iv-evidence.js
          node test-iv-comparison.js
          node test-iv-physical.js
          node test-iv-physical-composite.js
          node test-iv-workspaces.js
          node test-iv-allocation.js
          node test-iv-trajectory.js
          node test-iv-tech.js
          node test-iv-methods.js
          node test-iv-origin.js
          node test-iv-energy-structure.js
          node test-iv-pulse.js
          node test-iv-trade.js
          node test-iv-labour.js
          node test-iv-prices.js
          node test-facility-map.js
          node test-bank-directory.js
          node test-bank-capital.js
          node test-bank-capital-history.js
          node test-bank-balance.js
