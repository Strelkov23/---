          node test-stat-revisions.js
          node test-chain-stress.js
          node test-sector-chain.js
          node test-balance-matrix.js
          node test-capacity-analysis.js
          node test-chart-layout.js
          node test-macro-diagnostics.js
          node test-diagnostic-backtest.js
          node test-reproduction-plan.js
          node test-resource-plan.js
          node test-plan-feasibility.js
          node test-plan-register.js
          node test-public-plan-fact.js
          node test-deviation-monitor.js
          node test-plan-comparison.js
          node test-plan-diagnostics.js
          node test-analyst-cockpit.js
          node test-plan-report.js
          node test-horizon-feasibility.js
          node test-dynamic-plan.js
          node test-global-plan.js
          node test-labor-calibration.js
          node test-labor-diagnostics.js
          node test-investment-diagnostics.js
          node test-dependency-diagnostics.js
          node test-data-registry.js
          node test-economic-ai.js
          node test-economic-ai-series.js
          python3 -m unittest test_economic_ai_memory.py test_economic_ai_discovery.py
          node test-research-projects.js
          node test-provenance.js
          node test-index-builder.js
          node test-composite-index.js
          node test-report-builder.js
          node test-cost-structure.js
          node test-food-balance.js
          node test-electricity-balance.js
          node test-energy-output.js
          rm -rf public
          ECONOMIC_SOURCE_REVISION=$(cat /tmp/economic-source-revision) python3 build.py --refresh
          python3 -c "import json,economic_ai_discovery as a; from pathlib import Path; p=Path('public'); print(a.validate(json.loads((p/a.FILE).read_text()))); assert a.FILE in json.loads((p/'data-manifest.json').read_text())['files']"
          python3 -c "import json,economic_ai_memory as a; from pathlib import Path; p=Path('public'); d=json.loads((p/a.FILE).read_text()); print(a.validate(d)); assert a.FILE in json.loads((p/'data-manifest.json').read_text())['files']"
          python3 iv_release.py public ../history/published
          node test-price-model.js
          node test-technology.js
          node test-cost-decomposition.js
          git rev-parse HEAD > public/source-version.txt
          cp public/source-version.txt public/version.txt
          python3 -c "import sqlite3; s=sqlite3.connect('data/monitor.db'); d=sqlite3.connect('../history/monitor.db'); s.backup(d); d.close(); s.close()"
      - name: Check rendered analyst dashboard
        working-directory: monitor/public
        run: |
          python3 -m http.server 8765 > /tmp/monitor-http.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://localhost:8765/ > /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/?q=налог' > /tmp/monitor-dom.html
          python3 -c "from pathlib import Path; s=Path('/tmp/monitor-dom.html').read_text(); assert 'Найдено материалов: ' in s and 'Изменение валового выпуска:' in s and 'Не удалось загрузить данные' not in s"
