name: Economic monitor
on:
  push:
    branches: [main]
    paths: ['EconomicsPages.zip', '.github/workflows/publish.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  group: economic-monitor
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore archive and build
        run: |
          unzip -q EconomicsPages.zip -d monitor
          mkdir -p history
          if test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db; fi
          cd monitor
          python3 build.py --refresh
          python3 -c "import sqlite3; s=sqlite3.connect('data/monitor.db'); d=sqlite3.connect('../history/monitor.db'); s.backup(d); d.close(); s.close()"
      - name: Save updated history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/monitor.db
          if ! git diff --cached --quiet; then git commit -m 'Update economic archive'; git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: monitor/public
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
