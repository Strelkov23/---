          python3 -c "from pathlib import Path; s=Path('/tmp/mobile.html').read_text(); assert 'Найдено материалов: ' in s and 'Межотраслевой сценарий' in s and 'primary-nav' in s and 'Выберите направление работы' in s"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/papers.html' > /tmp/papers-dom.html
          python3 -c "from pathlib import Path; import json; s=Path('/tmp/papers-dom.html').read_text(); d=json.loads(Path('literature.json').read_text()); a=d['articles']; assert len(d['registry']) >= 13 and 'Найдено статей:' in s and 'paper-meta' in s and 'В общей подборке:' in s and (not a or ('https://doi.org/' in s and 'В подборку' in s)); assert Path('indicator-NY.GDP.MKTP.KD.ZG.html').exists()"
          google-chrome --headless --no-sandbox --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/desk.html' > /tmp/desk.html
          google-chrome --headless --no-sandbox --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/compare.html?begin=2010&finish=2020' > /tmp/pair.html
          python3 -c "from pathlib import Path; assert 'Найдено материалов: ' in Path('/tmp/desk.html').read_text(); s=Path('/tmp/pair.html').read_text(); assert 'Совместных наблюдений:' in s or 'За выбранный период общих наблюдений нет.' in s"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/statistics.html' > /tmp/statistics-dom.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/diagnostics.html' > /tmp/diagnostics-dom.html
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/scenario.html' > /tmp/scenario-dom.html
          python3 -c "from pathlib import Path; import json; assert len(json.loads(Path('catalog.json').read_text())) >= 100; assert 'Показателей: ' in Path('/tmp/statistics-dom.html').read_text(); assert 'Рассчитано наблюдений:' in Path('/tmp/diagnostics-dom.html').read_text(); assert 'Групп выше условного предела:' in Path('/tmp/scenario-dom.html').read_text() and 'максимальная доля единого сценария:' in Path('/tmp/scenario-dom.html').read_text() and 'Условный сценарий:' in Path('/tmp/scenario-dom.html').read_text() and 'Рассчитано альтернатив: 3' in Path('/tmp/scenario-dom.html').read_text() and 'Рассчитано периодов: 5' in Path('/tmp/scenario-dom.html').read_text() and 'Максимум доли в следующем периоде' in Path('/tmp/scenario-dom.html').read_text(); assert Path('supplier-dependencies.csv').exists()"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/national.html' > /tmp/national-dom.html
          python3 -c "from pathlib import Path; import json; p=Path('.'); assert len(json.loads((p/'national.json').read_text())) == 13; assert 'Наблюдений:' in Path('/tmp/national-dom.html').read_text()"
          for route in programmes.html programmes.json programmes.csv national-goals.json national-goals.csv annual-goals.json annual-goals.csv programme-budget.json programme-budget.csv health-projects.json health-projects.csv budget-diagnostics.html budget-diagnostics.json budget-diagnostics.csv programme-evidence.html programme-evidence.json programme-evidence.csv programme-evidence.md labor.html labor-data.json labor-broad.csv labor-regional.csv labor-coefficients-template.csv labor-data.js labor-calibration.js prices.html price-data.json price-coefficients.csv labor-hours-template.csv price-model.js technology.html technology.js forecast.html forecast.js forecast.json forecast.csv forecast-backtests.csv capital.html capital-data.js capital-data.json fixed-assets.csv capacity-utilization.csv data-registry.html data-registry.js data-registry.json data-registry.csv method-passports.html method-passports.csv method-passports.json wdi-metadata.json data-manifest.json reproducibility.html provenance.js reproducibility.js source-version.txt index-builder.html index-builder.js composite-index.js report-builder.html report-builder.js finance.html finance-data.js finance-data.json finance-profitability.csv financial-state.html financial-state.js financial-state.json organization-debt.csv organization-results.csv cost-structure.html cost-structure.js cost-structure.json cost-structure.csv food-balance.html food-balance.js food-balance.json food-balance.csv electricity-balance.json electricity-balance.csv electricity-balance.js monitoring.html data-centre.html sectors.html analysis-centre.html research-centre.html quality-centre.html index.html papers.html statistics.html national.html methodology.html links.html diagnostics.html scenario.html atlas.html directory.html laws.html compare.html desk.html week.html 404.html archive/ stats/ model/ papers/; do curl --fail --silent "http://localhost:8765/$route" > /dev/null; done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom 'http://localhost:8765/historical.html' > /tmp/historical-dom.html
          python3 -c "from pathlib import Path; s=Path('/tmp/historical-dom.html').read_text(); assert 'обнаруженных официальных файлов' in s and 'Казначейство' in s and 'ЕМИСС' in s and 'Сопоставление показателей территории' in s and 'rc-base' in s and 'Межрегиональное неравенство и диспропорции' in s and 'rd-panel' in s and 'geo-form' in s and 'Загрузка географической базы…' not in s and 'Каталог диагностики недоступен.' not in s and 'Загрузка каталога…' not in s and 'Каталог сопоставления недоступен.' not in s; import json; d=json.loads(Path('historical.json').read_text()); assert not d['series'] or ('Тепловая карта динамики' in s and 'Сравнение территорий ·' in s)"
          for route in normalized-data.html normalized-observations.json source-journal.html source-journal.json source-pipeline.html source-pipeline.json data-infrastructure.html data-infrastructure.json journal-evidence.html journal-evidence.json research-projects.html research-projects.js literature-quality.html literature-quality.json literature-journals.csv literature-years.csv literature-topics.csv diagnostic-backtest.html diagnostic-backtest.js investment-diagnostics.js dependency-diagnostics.js planning-centre.html balance-audit.html balance-audit.json balance-audit.csv plan-feasibility.html plan-feasibility.js horizon-feasibility.html horizon-feasibility.js cost-decomposition.html cost-decomposition.js territorial-plan.html territorial-plan.js; do
            curl --retry 2 --retry-all-errors --max-time 25 --silent --show-error --fail "http://localhost:8765/$route" > /dev/null
          done
