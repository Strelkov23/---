name: Atlas source integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/atlas-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixed archive and exact rows
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=site python3 - <<'PY'
          import regional_manufacturing as m
          import regional_industry_extra as x
          from urllib.request import Request,urlopen
          from pathlib import Path
          import hashlib,json
          with urlopen(Request(m.SOURCE,headers={"User-Agent":"Mozilla/5.0"}),timeout=30) as f:
              raw=f.read(35000001)
          sha=hashlib.sha256(raw).hexdigest()
          assert sha==m.EXPECTED_SHA256,sha
          d={**m.empty("2026-11-25"),"rows":m.parse(raw),"sha256":sha,"checked":"2026-11-25","success":"2026-11-25","status":"Импортировано"}
          counts=m.quality(d)
          print("MANUFACTURING",json.dumps(counts,ensure_ascii=False))
          assert counts["regional_manufacturing_rows"]==2688
          assert counts["regional_manufacturing_numeric"]==2576
          assert counts["regional_manufacturing_suppressed"]==112
          # Only the temporary runner checkout receives the validated file. Nothing is pushed.
          p=Path("history/published/regional-manufacturing.json");p.write_text(json.dumps(d,ensure_ascii=False),encoding="utf-8")
          e={**x.empty("2026-11-25"),"rows":x.parse(raw),"sha256":sha,"checked":"2026-11-25","success":"2026-11-25","status":"Импортировано"}
          counts=x.quality(e)
          print("MINING_ENERGY",json.dumps(counts,ensure_ascii=False))
          assert counts["regional_mining_energy_rows"]==1920
          assert counts["regional_mining_energy_groups"]==10
          Path("history/published/regional-mining-energy.json").write_text(json.dumps(e,ensure_ascii=False),encoding="utf-8")
          PY
      - name: Build using real archive and saved database
        run: |
          unzip -q EconomicsPages.zip -d monitor
          cp site/* monitor/
          mkdir -p monitor/data
          if test -f history/monitor.db.gz; then gzip -dc history/monitor.db.gz > monitor/data/monitor.db
          elif test -f history/monitor.db; then cp history/monitor.db monitor/data/monitor.db
          else exit 1; fi
          cd monitor
          python3 -m pip install openpyxl==3.1.5 pyarrow==20.0.0 xlrd==2.0.2 playwright==1.51.0
          python3 -m unittest test_regional_manufacturing.py test_regional_industry_extra.py
          node test-regional-manufacturing.js
          ECONOMIC_SOURCE_REVISION=$(git rev-parse HEAD) python3 build.py
          git rev-parse HEAD > public/source-version.txt
          cp public/source-version.txt public/version.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("public/quality.json").read_text())
          print("QUALITY",json.dumps(q,ensure_ascii=False))
          assert not q["errors"],q["errors"]
          PY
      - name: Browser integration against real data
        run: |
          cd monitor/public
          python3 -m http.server 8765 > /tmp/layout-http.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do if curl --silent --fail http://localhost:8765/index.html > /dev/null; then break; fi; sleep 1; done
          CHROME_BIN=$(command -v google-chrome) python3 ../test_global_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-atlas-quality
          path: |
            monitor/public/quality.json
            monitor/public/regional-manufacturing.json
            monitor/public/regional-manufacturing.csv
            monitor/public/regional-mining-energy.json
            monitor/public/regional-mining-energy.csv
          if-no-files-found: ignore
