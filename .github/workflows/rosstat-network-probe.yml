name: Rosstat isolated network acceptance
on:
  push:
    branches: [stage-f-rosstat-network, stage-f-rosstat-candidate-recovery]
    paths: ['site/rosstat_network_probe.py', 'site/test_rosstat_network_probe.py', '.github/workflows/rosstat-network-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rosstat-isolated-network-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and inspect official catalogues
        run: |
          python -m pip install openpyxl==3.1.5 xlrd==2.0.2
          cd site
          python -m unittest test_rosstat_network_probe.py
          if [ "$GITHUB_REF_NAME" = "stage-f-rosstat-candidate-recovery" ]; then
            python rosstat_network_probe.py --alternatives --output ../rosstat-network-probe.json
          else
            python rosstat_network_probe.py --output ../rosstat-network-probe.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rosstat-network-probe
          path: rosstat-network-probe.json
          retention-days: 30
          if-no-files-found: ignore
