<h1>Сравнение показателей</h1><p>Выберите два годовых ряда и период. Разницу между первым и последним значениями таблица рассчитывает за одни и те же годы для обоих рядов. У каждого графика своя вертикальная шкала. Пропущенные годы обозначены прочерком в таблице.</p>
<form id="compare-form"><label>Первый показатель<select id="left"></select></label><label>Второй показатель<select id="right"></select></label><label>С года<input id="begin" type="number" min="1991"></label><label>По год<input id="finish" type="number" min="1991"></label></form><p id="pair-status" role="status">Загрузка наблюдений…</p><p id="pair-method-warning" role="status"></p><div id="pair-summary" class="duo"></div><p><button id="pair-csv" disabled>Скачать сравнение CSV</button></p><div id="pair-table"></div><script defer src="compare.js"></script>
