<section class="mast"><h1>Экономическая литература</h1><p>Научные статьи и ссылки DOI. Названия и авторы приведены по метаданным Crossref. Темы определяются по словам в названии.</p></section>
<form id="paper-filters"><label>Название, автор или DOI<input type="search" id="term"></label><label>Журнал<select id="journal"><option value="">Все журналы</option></select></label><label>Тема<select id="theme"><option value="">Все темы</option></select></label><label>Год от<input id="from" type="number" min="1991" max="2100"></label><label>Год до<input id="to" type="number" min="1991" max="2100"></label><button type="reset">Сбросить</button></form>
<div class="actions"><strong id="found" role="status">Загрузка библиографии…</strong><button id="references" disabled>Скачать библиографию CSV</button></div><div id="papers"></div><button id="next" hidden>Ещё статьи</button><details><summary>Охват журналов и состояние загрузки</summary><div id="journals-status"></div></details><script defer src="papers.js"></script>
